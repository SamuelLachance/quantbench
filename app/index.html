<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantBench — Valorisation intrinsèque · NASDAQ · NYSE · Canada · OTC</title>
<meta name="description" content="Valorisation intrinsèque, forensique et sentiment — screener pro gratuit : NASDAQ, NYSE, Bourse canadienne et OTC.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('qb-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><a href="index.html" style="text-decoration:none"><span class="mark">Quant<b>Bench</b></span></a></div>
    <div class="navlinks">
      <div class="search"><input id="tickerSearch" list="tickerList" placeholder="ticker…" autocomplete="off" spellcheck="false"><button id="searchGo" type="button">↵</button></div>
      <datalist id="tickerList"></datalist>
      <a href="index.html" class="active">Marché</a>
      <a href="screener.html">Screener</a>
      <a href="shortterm.html">Court terme</a>
      <button class="toggle" id="themeBtn" type="button">◐</button>
    </div>
  </nav>

  <div class="grid g4" id="stats" style="margin-bottom:18px"></div>

  <div class="pcards">
    <div class="card" style="margin-bottom:0">
      <h2>Sous-valorisées <span class="sub">valeur intrinsèque &gt; cours</span></h2>
      <div class="tableScroll"><table><thead><tr><th>Titre</th><th>Secteur</th><th>Cap</th><th>Upside</th><th>F</th></tr></thead><tbody id="up"></tbody></table></div>
    </div>
    <div class="card" style="margin-bottom:0">
      <h2>Richement valorisées <span class="sub">le marché price l'optimisme</span></h2>
      <div class="tableScroll"><table><thead><tr><th>Titre</th><th>Secteur</th><th>Cap</th><th>Upside</th><th>F</th></tr></thead><tbody id="down"></tbody></table></div>
    </div>
  </div>

  <p class="mini" id="disc" style="margin-top:16px"></p>
</div>

<script src="assets/app.js"></script>
<script>
function row(r){
  const cls=(r.upside||0)>=0?'pos':'neg';
  return `<tr onclick="location.href='stock.html?t=${r.ticker}'">
    <td><span class="tk-cell">${r.ticker}</span></td>
    <td><span class="pill">${(r.sector||'—')}</span></td>
    <td class="num">${r.market_cap==null?'—':QB.nf0.format(r.market_cap)+' Md'}</td>
    <td class="num ${cls}" style="font-weight:600">${QB.pct(r.upside)}</td>
    <td class="num">${r.piotroski==null?'—':r.piotroski}</td></tr>`;
}
(async()=>{
  QB.initTheme(); QB.mountSearch();
  let d; try{ d=await (await fetch('us/_screener.json',{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('disc').textContent='Données indisponibles.'; return; }
  const rows=d.rows||[];
  const uv=rows.filter(r=>r.upside>0).length;
  const meds=rows.map(r=>r.upside).filter(v=>v!=null).sort((a,b)=>a-b);
  const med=meds.length?meds[Math.floor(meds.length/2)]:0;
  document.getElementById('stats').innerHTML=[
    ['Titres couverts',d.n_ok],['Sous-valorisés',`${uv}/${d.n_ok}`],
    ['Upside médian',QB.pct(med)],['MàJ',d.updated||'—']
  ].map(([k,v])=>`<div class="tile"><div class="k">${k}</div><div class="v" style="font-size:${String(v).length>10?'14px':'22px'}">${v}</div></div>`).join('');
  // Dashboard = opportunités crédibles : plancher de capitalisation (pros).
  const big=rows.filter(r=>r.upside!=null && (r.market_cap||0)>=5);
  document.getElementById('up').innerHTML=big.slice(0,15).map(row).join('');
  document.getElementById('down').innerHTML=big.slice(-12).reverse().map(row).join('');
  document.getElementById('disc').innerHTML=`${d.n_ok} titres · NASDAQ, NYSE, Canada &amp; OTC · top opportunités filtrées ≥ 5 Md$ · valorisation routée (Damodaran) + forensique + sentiment · SEC + marché, USD · éducatif, pas un conseil.`;
})();
</script>
</body>
</html>
