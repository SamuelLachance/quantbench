<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantBench — Screener personnalisable</title>
<meta name="description" content="Screener d'actions gratuit et personnalisable : valorisation, forensique, filtres multi-critères.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('qb-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><a href="index.html" style="text-decoration:none"><span class="mark">Quant<b>Bench</b></span></a></div>
    <div class="navlinks">
      <div class="search"><input id="tickerSearch" list="tickerList" placeholder="ticker…" autocomplete="off" spellcheck="false"><button id="searchGo" type="button">↵</button></div>
      <datalist id="tickerList"></datalist>
      <a href="index.html">Marché</a>
      <a href="screener.html" class="active">Screener</a>
      <a href="shortterm.html">Court terme</a>
      <button class="toggle" id="themeBtn" type="button">◐</button>
    </div>
  </nav>

  <div class="card" style="margin-top:4px">
    <div class="filters" id="filters">
      <div class="field"><label>Recherche</label><input id="q" type="text" placeholder="ticker ou nom"></div>
      <div class="field"><label>Secteur</label><select id="sector"></select></div>
      <div class="field"><label>Catégorie</label><select id="category"></select></div>
      <div class="field"><label>Upside min (%)</label><input id="upmin" type="number" placeholder="ex. 0"></div>
      <div class="field"><label>Upside max (%)</label><input id="upmax" type="number" placeholder="ex. 100"></div>
      <div class="field"><label>F-Score min</label><input id="fmin" type="number" min="0" max="9" placeholder="0-9"></div>
      <div class="field"><label>Cap. mini (Md$)</label><input id="capmin" type="number" placeholder="ex. 10"></div>
      <div class="field"><label>Signaux forensiques</label>
        <select id="flags"><option value="">tous</option><option value="none">aucun</option>
        <option value="any">≥ 1 alerte</option><option value="beneish">M-Score alerté</option></select></div>
      <div class="field"><label>Risque au plus</label>
        <select id="riskmax"><option value="">tous</option>
        <option value="A-">A− ou mieux</option><option value="B">B ou mieux</option>
        <option value="B-">B− ou mieux</option><option value="C">C ou mieux</option>
        <option value="C-">C− ou mieux</option><option value="D">D ou mieux</option></select></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span id="count" class="mono" style="font-size:13px;color:var(--muted)"></span>
      <button class="toggle" id="reset" type="button">Réinitialiser</button>
    </div>
    <div class="tableScroll">
      <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
    </div>
  </div>
  <p class="disclaimer" id="disc"></p>
</div>

<script src="assets/app.js"></script>
<script>
let ROWS=[], SORT={key:'upside',dir:-1};
const COLS=[
  {k:'ticker',t:'Titre',fmt:r=>`<span class="tk-cell">${r.ticker}</span> <span style="color:var(--muted);font-size:12px">${(r.name||'').slice(0,22)}</span>`,num:false},
  {k:'sector',t:'Secteur',fmt:r=>`<span class="pill">${(r.sector||'—')}</span>`,num:false},
  {k:'category',t:'Méthode',fmt:r=>r.category||'—',num:false},
  {k:'price',t:'Cours',fmt:r=>QB.usd(r.price),num:true},
  {k:'value_per_share',t:'Valeur/action',fmt:r=>QB.usd(r.value_per_share),num:true},
  {k:'upside',t:'Upside',fmt:r=>upCell(r.upside),num:true},
  {k:'score_risque',t:'Risque',fmt:r=>noteCell(r.note_risque),num:true},
  {k:'piotroski',t:'F-Score',fmt:r=>r.piotroski==null?'—':`${r.piotroski}/9`,num:true},
  {k:'roe',t:'ROE',fmt:r=>r.roe==null?'—':QB.pct(r.roe,0),num:true},
  {k:'n_flags',t:'Alertes',fmt:r=>r.n_flags?`<span class="pill flag">${r.n_flags}</span>`:'<span class="pill good">0</span>',num:true},
];
/* La note de risque se trie sur le SCORE continu et non sur la lettre : trier
   sur le grade regrouperait treize paquets et perdrait tout l'ordre interne. */
function noteCell(g){if(!g)return'<span class="mono" style="color:var(--faint)">—</span>';
  return `<span class="note-risque tag nr-${g[0].toLowerCase()}">${g}</span>`;}
function upCell(u){if(u==null)return'—';const cls=u>=0?'pos':'neg';const w=Math.min(Math.abs(u),1)*38;
  const bar=u>=0?`<i style="left:50%;width:${w}px;background:var(--pos)"></i>`:`<i style="right:50%;width:${w}px;background:var(--neg)"></i>`;
  return `<span class="mono ${cls}" style="font-weight:600">${QB.pct(u)}</span> <span class="ubar"><span class="mid"></span>${bar}</span>`;}

function apply(){
  const q=(document.getElementById('q').value||'').toUpperCase();
  const sec=document.getElementById('sector').value, cat=document.getElementById('category').value;
  const upmin=parseFloat(document.getElementById('upmin').value), upmax=parseFloat(document.getElementById('upmax').value);
  const fmin=parseFloat(document.getElementById('fmin').value), capmin=parseFloat(document.getElementById('capmin').value);
  const fl=document.getElementById('flags').value;
  let out=ROWS.filter(r=>{
    if(q && !((r.ticker||'').includes(q)||(r.name||'').toUpperCase().includes(q)))return false;
    if(sec && r.sector!==sec)return false;
    if(cat && r.category!==cat)return false;
    if(!isNaN(upmin)&&(r.upside==null||r.upside*100<upmin))return false;
    if(!isNaN(upmax)&&(r.upside==null||r.upside*100>upmax))return false;
    if(!isNaN(fmin)&&(r.piotroski==null||r.piotroski<fmin))return false;
    if(!isNaN(capmin)&&(r.market_cap==null||r.market_cap<capmin))return false;
    if(fl==='none'&&r.n_flags>0)return false;
    if(fl==='any'&&!(r.n_flags>0))return false;
    if(fl==='beneish'&&!r.beneish_flag)return false;
    const rmax=document.getElementById('riskmax');
    if(rmax&&rmax.value){
      const ordre=['A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-','F'];
      const i=ordre.indexOf(r.note_risque||''), j=ordre.indexOf(rmax.value);
      if(i<0||i>j)return false;
    }
    return true;
  });
  out.sort((a,b)=>{const x=a[SORT.key],y=b[SORT.key];
    if(x==null)return 1; if(y==null)return -1; return (x>y?1:x<y?-1:0)*SORT.dir;});
  document.getElementById('count').textContent=`${out.length} titres`;
  document.getElementById('body').innerHTML=out.map(r=>
    `<tr onclick="location.href='stock.html?t=${r.ticker}'">`+COLS.map(c=>`<td class="${c.num?'num':''}">${c.fmt(r)}</td>`).join('')+`</tr>`).join('');
}
function renderHead(){
  document.getElementById('head').innerHTML=COLS.map(c=>{
    const arr=c.k===SORT.key?`<span style="color:var(--accent)">${SORT.dir<0?'▼':'▲'}</span>`:'';
    return `<th data-k="${c.k}">${c.t} ${arr}</th>`;}).join('');
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(k===SORT.key)SORT.dir*=-1; else{SORT.key=k;SORT.dir=-1;}
    renderHead(); apply();});
}
(async()=>{
  QB.initTheme(); QB.mountSearch();
  let d; try{ d=await (await fetch('us/_screener.json',{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('disc').textContent='Données indisponibles.'; return; }
  ROWS=d.rows||[];
  const sectors=[...new Set(ROWS.map(r=>r.sector).filter(Boolean))].sort();
  const cats=[...new Set(ROWS.map(r=>r.category).filter(Boolean))].sort();
  document.getElementById('sector').innerHTML='<option value="">tous</option>'+sectors.map(s=>`<option>${s}</option>`).join('');
  document.getElementById('category').innerHTML='<option value="">toutes</option>'+cats.map(s=>`<option>${s}</option>`).join('');
  document.querySelectorAll('.filters input,.filters select').forEach(el=>el.addEventListener('input',apply));
  document.getElementById('reset').onclick=()=>{document.querySelectorAll('.filters input,.filters select').forEach(el=>el.value='');apply();};
  document.getElementById('disc').innerHTML='Éducatif — pas un conseil d’investissement. '+d.n_ok+' titres couverts, '+d.n_suspect+' écartés (données suspectes).';
  renderHead(); apply();
})();
</script>
</body>
</html>
