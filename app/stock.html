<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantBench — Profil</title>
<meta name="description" content="Profil complet : valorisation intrinsèque, analyse forensique, états financiers et news.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <div class="brand"><span class="mark">Quant<b>Bench</b></span></div>
    <div class="navlinks">
      <a href="index.html">Accueil</a>
      <a href="screener.html">Screener</a>
      <button class="toggle" id="themeBtn" type="button">Thème</button>
    </div>
  </nav>
  <div id="app"><div class="loading">Chargement…</div></div>
</div>

<script src="assets/app.js"></script>
<script>
const P = QB.pct.bind(QB), U = QB.usd.bind(QB);
function badge(l){const m={positive:'positive',negative:'negative',neutral:'neutral'};
  const txt={positive:'positif',negative:'négatif',neutral:'neutre'};
  return `<span class="badge ${m[l]||'neutral'}">${txt[l]||'neutre'}</span>`;}

function statementsTable(s){
  if(!s||!s.years)return'';
  const rows=[['Chiffre d\'affaires','revenue'],['Résultat opérationnel','ebit'],
    ['Résultat net','net_income'],['Cash-flow d\'exploitation','cfo'],
    ['Actif total','total_assets'],['Capitaux propres','equity'],['Dette','total_debt']];
  const head='<tr><th>Md USD</th>'+s.years.map(y=>`<th>${y}</th>`).join('')+'</tr>';
  const body=rows.map(([lab,k])=>`<tr><td>${lab}</td>`+
    (s[k]||[]).map(v=>`<td class="num">${v==null?'—':QB.nf1.format(v)}</td>`).join('')+'</tr>').join('');
  return `<div class="tableScroll"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function render(d){
  const v=d.valuation||{}, f=d.forensics, fu=d.fundamentals||{}, sc=(f&&f.scores)||{};
  const up=v.upside, upcls=(up||0)>=0?'pos':'neg';
  const scoreTile=(k,val,note)=>`<div class="tile"><div class="k">${k}</div><div class="v">${val}</div><div class="s">${note||''}</div></div>`;
  const html=`
  <div class="phead">
    <div>
      <div class="eyebrow">${d.sector||''}${d.industry?' · '+d.industry:''}</div>
      <h1>${d.name||d.ticker} <span class="mono" style="color:var(--accent)">${d.ticker}</span></h1>
      <div style="color:var(--muted);font-size:13px">Méthode : ${v.method||'—'} · confiance ${v.confidence||'—'}</div>
    </div>
    <div class="px">
      <div class="tile" style="border:none;box-shadow:none;padding:0">
        <div class="k">Cours</div><div class="v">${U(v.price)}</div>
        <div class="s">Cap. ${QB.bn(v.market_cap)}</div></div>
    </div>
  </div>

  <div class="verdict">
    <div class="vcell"><div class="k">Valeur intrinsèque / action</div>
      <div class="big ${upcls}">${U(v.value_per_share)}</div>
      <div class="note">vs cours ${U(v.price)}</div></div>
    <div class="vcell"><div class="k">Upside vs cours</div>
      <div class="big ${upcls}">${P(up)}</div>
      <div class="note">${v.category||''}</div></div>
    <div class="vcell"><div class="k">Signaux forensiques</div>
      <div class="big">${f?((f.positives||[]).length):0}<span style="color:var(--pos);font-size:16px"> +</span> / ${f?((f.flags||[]).length):0}<span style="color:var(--neg);font-size:16px"> ⚠</span></div>
      <div class="note">points positifs / alertes</div></div>
  </div>

  ${f?`<div class="card">
    <div class="eyebrow">Analyse forensique</div>
    <h2>Qualité des comptes &amp; solidité</h2>
    <p class="desc">Signaux statistiques à investiguer — <b>pas</b> une preuve. Modèles : Beneish, Altman, Piotroski, accruals.</p>
    <div class="grid g4" style="margin-bottom:14px">
      ${scoreTile('Piotroski F', sc.piotroski_f==null?'—':sc.piotroski_f+'/9','fondamentaux')}
      ${scoreTile('Beneish M', sc.beneish_m==null?'—':sc.beneish_m, sc.beneish_flag?'zone à investiguer':'ok')}
      ${scoreTile('Altman Z″', sc.altman_z==null?'—':sc.altman_z, sc.altman_z==null?'':(sc.altman_z<1.1?'détresse':sc.altman_z>2.6?'sain':'gris'))}
      ${scoreTile('Accruals', sc.accruals_ratio==null?'—':(sc.accruals_ratio*100).toFixed(1)+'%','qualité résultat')}
    </div>
    ${(f.positives&&f.positives.length)?'<div style="margin-bottom:10px">'+f.positives.map(p=>`<div class="flagitem"><span class="pill good">+</span><span>${p}</span></div>`).join('')+'</div>':''}
    ${(f.flags&&f.flags.length)?f.flags.map(x=>`<div class="flagitem"><span class="pill flag">⚠</span><span>${x}</span></div>`).join(''):'<div style="color:var(--muted);font-size:13px">Aucune alerte détectée.</div>'}
  </div>`:''}

  <div class="card">
    <div class="eyebrow">États financiers</div>
    <h2>4 derniers exercices</h2>
    ${statementsTable(d.statements)}
    <p class="desc" style="margin-top:12px">Source : SEC Financial Statement Data Sets (dépôts 10-K).
      <a href="${d.filing_url}" target="_blank" rel="noopener">Voir les dépôts officiels sur SEC EDGAR →</a></p>
  </div>

  <div class="card">
    <div class="eyebrow">Actualités</div>
    <h2>Dernières news, classées par sentiment</h2>
    <div class="newslist">
      ${(d.news&&d.news.length)?d.news.map(n=>`<div class="newsitem">${badge(n.label)}
        <div><div class="t">${n.url?`<a href="${n.url}" target="_blank" rel="noopener">${n.title}</a>`:n.title}</div>
        <div class="src">${n.publisher||''}</div></div></div>`).join(''):'<div style="color:var(--muted);font-size:13px">Pas d\'actualité récente.</div>'}
    </div>
  </div>

  <p class="disclaimer">Outil de recherche <b>éducatif — pas un conseil d’investissement</b>. Valorisation sur
    cas de base conservateur ; les signaux forensiques sont statistiques et à investiguer, jamais une accusation.
    Fondamentaux SEC, prix marché, en USD.</p>`;
  document.getElementById('app').innerHTML=html;
  document.title='QuantBench — '+(d.name||d.ticker);
}
(async()=>{
  QB.initTheme();
  const t=(QB.qs('t')||'').toUpperCase();
  if(!t){document.getElementById('app').innerHTML='<div class="loading">Aucun titre spécifié. <a href="screener.html">Ouvrir le screener</a>.</div>';return;}
  try{ const d=await (await fetch('us/'+t+'.json',{cache:'no-store'})).json(); render(d); }
  catch(e){ document.getElementById('app').innerHTML=`<div class="loading">Profil indisponible pour <b>${t}</b>. <a href="screener.html">Retour au screener</a>.</div>`; }
})();
</script>
</body>
</html>
