name: Build & Deploy (NASDAQ, quotidien)

on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC chaque jour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "quantbench/**"
      - "scripts/build_site_fmp.py"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 330          # ~7000 titres (NASDAQ+NYSE+Canada) ; marge sous limite 6h
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install numpy pandas scipy scikit-learn requests reportlab
      - name: Régénérer US + Canada (FMP)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          QUANTBENCH_SEC_UA: ${{ secrets.QUANTBENCH_SEC_UA }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"          # progression visible en direct dans le log CI
        run: python scripts/build_site_fmp.py --exchanges NASDAQ,NYSE,TSX,TSXV --workers 24
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./app
      - id: deployment
        uses: actions/deploy-pages@v4
