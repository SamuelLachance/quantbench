name: Build & Deploy (quotidien, shardé)

# PAS DE DECLENCHEUR SUR LES POUSSEES DE CODE, ET C'EST DELIBERE.
#
# Le build reconstruit 16 800 titres en une a trois heures. Avec un declencheur sur
# `quantbench/**`, chaque commit en relancait un — or le groupe de concurrence
# n'admet qu'un seul run EN ATTENTE : A tourne, B patiente, C arrive, et B est
# ANNULE. Une journee de corrections successives ne produisait donc aucun
# deploiement, et le tableau de bord affichait une file de runs "cancelled" qui
# ressemblaient a des echecs sans en etre.
#
# La justesse du code est verifiee par l'integration continue, qui tourne en une
# minute sur chaque poussee. Le site, lui, se reconstruit une fois par jour — ses
# donnees sont quotidiennes, une reconstruction par commit n'apporterait rien.
# Pour publier immediatement : declenchement manuel.
on:
  schedule:
    - cron: "0 6 * * *"          # 06:00 UTC chaque jour
  workflow_dispatch:

permissions:
  # `write` sur le contenu parce que l'etape de fusion COMMITE l'archive mensuelle
  # des notes de risque. Chaque execution repart d'une copie fraiche du depot :
  # sans commit, cette archive se recreait vide tous les jours, et la mesure a
  # douze mois qu'elle prepare — la seule qui autoriserait a ponderer les
  # dimensions autrement qu'uniformement — n'aurait jamais eu de matiere.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 5 jobs parallèles : chacun valorise ~1/5 de l'univers (NASDAQ+NYSE+Canada+OTC).
  # Partition stable par crc32(ticker) — chaque job reste bien sous le plafond 6h.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Build shard ${{ matrix.shard }}/5
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          QUANTBENCH_SEC_UA: ${{ secrets.QUANTBENCH_SEC_UA }}
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: >
          python scripts/build_site_fmp.py
          --exchanges NASDAQ,NYSE,TSX,TSXV,OTC
          --shard ${{ matrix.shard }}/5 --workers 24
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: app/us/
          retention-days: 1
          if-no-files-found: error

  # Combine les shards -> _screener/_shortterm, puis déploie sur Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances (combine)
        run: pip install -r requirements.txt
      - name: Télécharger tous les shards -> app/us
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: app/us
          merge-multiple: true
      - name: Combiner les shards
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/build_site_fmp.py --combine 5
      # BARRIERE QUALITE : si un invariant est viole (upside impossible, routage
      # sectoriel casse, obligation prise pour une action, effondrement de la
      # couverture), le job echoue ICI et le deploiement n'a pas lieu — le site
      # conserve ses dernieres donnees valides plutot que de publier un defaut.
      - name: Controle qualite du build
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/check_build.py
      # L'archive du mois est ecrite par la FUSION, qui seule voit l'univers
      # entier. On la commite APRES la barriere qualite : un build refuse ne doit
      # pas laisser derriere lui une archive tiree de donnees jugees mauvaises.
      - name: Conserver l'archive mensuelle des notes
        run: |
          if git diff --quiet --exit-code app/us/_notes_risque/ &&              [ -z "$(git ls-files --others --exclude-standard app/us/_notes_risque/)" ]; then
            echo "archive du mois deja a jour"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/us/_notes_risque/
            git commit -m "Archive des notes de risque du $(date -u +%Y-%m)"               -m "Ecrite par l'etape de fusion, apres la barriere qualite. Elle sera relue dans douze mois pour mesurer ce qui est arrive : c'est la seule mesure qui autorisera a ponderer les dimensions autrement qu'uniformement."
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./app
      - id: deployment
        uses: actions/deploy-pages@v4
