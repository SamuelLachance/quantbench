name: Repères sectoriels (mensuel)

# Les repères — bêta désendetté, marge, ventes sur capital, ROIC et taux de
# récupération par industrie — sont MESURÉS sur l'univers réel, et nourrissent le coût
# du capital, la croissance finançable et la valeur de liquidation de chaque titre.
#
# Ce sont donc des mesures VIVANTES, à distinguer du calibrage de la note de risque
# qui est délibérément GELÉ : là-bas le gel est ce qui fait la différence entre une
# note et un classement, ici l'immobilisme ferait dériver silencieusement toutes les
# valorisations. Aucun workflow ne les régénérait ; ils vieillissaient sans que rien
# ne le signale.
#
# Mensuel, et non quotidien : une médiane sectorielle mesurée sur des dizaines de
# sociétés ne bouge pas d'un jour à l'autre, et la faire varier chaque nuit
# introduirait du bruit dans des valorisations censées être stables.
#
# Le job ÉCRIT le fichier et publie l'écart avec la mesure précédente. Le garde-fou
# qualité du build quotidien reste seul juge de la mise en production : si un repère
# déplacé casse le panier de référence, le déploiement est refusé et le site conserve
# ses dernières données valides.

on:
  schedule:
    - cron: "0 3 1 * *"          # le 1er de chaque mois, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reperes
  cancel-in-progress: false

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Mesurer les repères sur l'univers
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/build_industry_stats.py --par-groupe 40

      - name: Vérifier que les invariants tiennent toujours
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Publier la nouvelle mesure
        run: |
          if git diff --quiet quantbench/valuation/industry_stats.json; then
            echo "aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quantbench/valuation/industry_stats.json
          git commit \
            -m "Reperes sectoriels mesures le $(date -u +%Y-%m-%d)" \
            -m "Mesure mensuelle sur l'univers reel : beta desendette, marge, ventes sur capital, ROIC et intensite d'actifs realisables, par industrie et par secteur. L'ecart avec la mesure precedente figure dans le journal du job." \
            -m "Le garde-fou qualite du build quotidien reste seul juge de la mise en production : si un repere deplace casse le panier de reference, le deploiement est refuse et le site conserve ses dernieres donnees valides."
          git push
