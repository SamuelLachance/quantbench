name = "quantbench-otc"
main = "quantbench-otc.js"
compatibility_date = "2024-09-01"

# Domaine custom : la zone quantbench.ca est déjà sur ton compte Cloudflare, donc
# wrangler crée automatiquement l'enregistrement DNS + le certificat au déploiement.
# Le Worker sera accessible sur https://otc.quantbench.ca (= QB.OTC_API dans app.js).
routes = [
  { pattern = "otc.quantbench.ca", custom_domain = true }
]

# Observabilité (logs) — optionnel
[observability]
enabled = true
